<!-- Add HTML tags here to be included in the head -->
<!--
  Keep pages discoverable in Google Search, but prevent page content from being
  shown as a snippet or used as direct input for AI Overviews and AI Mode.
-->
<meta name="googlebot" content="nosnippet">
<link rel="stylesheet" href="{{ '/assets/css/home-background.css' | relative_url }}">
<script src="{{ '/assets/js/home-background.js' | relative_url }}"
  data-video-root="{{ '/assets/video/' | relative_url }}"
  data-scenes="{{ site.data.home_backgrounds | jsonify | escape }}" defer></script>
<link rel="stylesheet" href="{{ '/assets/css/gallery-earth.css' | relative_url }}">
<script>
  (function () {
    var root = document.documentElement;
    root.classList.add('site-entering', 'site-loading');
    /* Leave the website usable even if the entrance script fails to run. */
    setTimeout(function () {
      root.classList.remove('site-entering', 'site-loading');
      root.classList.add('site-loaded');
    }, 5000);
  }());
</script>
<style id="site-loader-critical">
  html.site-loading,
  html.site-loading body {
    background: #111;
  }

  html.site-loading::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2147483646;
    background: #111;
  }

  html.site-loading #_pushState {
    visibility: hidden;
  }
</style>
